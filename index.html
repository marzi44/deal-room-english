<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deal Room English</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deal Room">
<meta name="theme-color" content="#F5F6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0E10" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: quiet iOS-style shell. Blurred top bar, one 640px column of hairline cards, bottom tab bar
   (floating on wide screens). Lessons, sheets and onboarding are full-screen layers.
   Direction: monochrome ink on cool neutral, one deep green accent, Geist type, hairlines instead of shadows. */
:root{
  --bg:#F5F6F7; --surface:#FFFFFF; --surface-2:#EEF0F2; --ink:#111417; --ink-2:#3E444B; --muted:#7B828A;
  --line:#E4E7EA; --line-2:#CFD4D9;
  --accent:#1E6B57; --accent-2:#17513F; --accent-soft:#E6F0EC; --on-accent:#FFFFFF;
  --btn:#111417; --on-btn:#FFFFFF;
  --gold:#A87B22; --gold-2:#8A6418; --gold-soft:#F5EEDF;
  --orange:#B8612C; --orange-soft:#F6EAE1;
  --coral:#B8443C; --coral-soft:#F8E9E7;
  --good:#23845E; --good-2:#1B6849; --good-soft:#E5F2EC;
  --bad:#BE4038; --bad-2:#9A322B; --bad-soft:#F9EAE8;
  --blue:#3D5A9E; --blue-2:#2F4780;
  --u0:#1E6B57; --u0d:#1E6B57; --u1:#3D5A9E; --u1d:#3D5A9E; --u2:#9C6A2E; --u2d:#9C6A2E; --u3:#6E4F92; --u3d:#6E4F92;
  --scrim:rgba(10,12,14,.38);
  --shadow:0 1px 2px rgba(17,20,23,.04),0 8px 24px rgba(17,20,23,.06);
  --f-display:"Geist",-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --f-body:"Geist",-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --r-sm:12px; --r:16px; --r-lg:22px; --tab-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D0E10; --surface:#16181B; --surface-2:#1E2125; --ink:#F1F2F4; --ink-2:#C3C7CD; --muted:#8B9199;
  --line:#25292E; --line-2:#343940;
  --accent:#5FBF9F; --accent-2:#46A384; --accent-soft:#15302A; --on-accent:#06150F;
  --btn:#F1F2F4; --on-btn:#0D0E10;
  --gold:#D6A74A; --gold-2:#B88A33; --gold-soft:#2C2416; --orange:#E08A55; --orange-soft:#2E2016;
  --coral:#E07A72; --coral-soft:#301A18; --good:#52C08F; --good-2:#3FA376; --good-soft:#12291E;
  --bad:#E5756C; --bad-2:#C85A51; --bad-soft:#311917; --blue:#8AA2E0; --blue-2:#6F88C8;
  --u0:#5FBF9F; --u0d:#5FBF9F; --u1:#8AA2E0; --u1d:#8AA2E0; --u2:#D19B5C; --u2d:#D19B5C; --u3:#B497DB; --u3d:#B497DB;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D0E10; --surface:#16181B; --surface-2:#1E2125; --ink:#F1F2F4; --ink-2:#C3C7CD; --muted:#8B9199;
  --line:#25292E; --line-2:#343940;
  --accent:#5FBF9F; --accent-2:#46A384; --accent-soft:#15302A; --on-accent:#06150F;
  --btn:#F1F2F4; --on-btn:#0D0E10;
  --gold:#D6A74A; --gold-2:#B88A33; --gold-soft:#2C2416; --orange:#E08A55; --orange-soft:#2E2016;
  --coral:#E07A72; --coral-soft:#301A18; --good:#52C08F; --good-2:#3FA376; --good-soft:#12291E;
  --bad:#E5756C; --bad-2:#C85A51; --bad-soft:#311917; --blue:#8AA2E0; --blue-2:#6F88C8;
  --u0:#5FBF9F; --u0d:#5FBF9F; --u1:#8AA2E0; --u1d:#8AA2E0; --u2:#D19B5C; --u2d:#D19B5C; --u3:#B497DB; --u3d:#B497DB;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;min-height:100vh;font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.028em;margin:0;line-height:1.12;text-wrap:balance}
p{margin:0}
svg{flex:none}
.wrap{width:100%;max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);padding-top:env(safe-area-inset-top,0px);border-bottom:.5px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topin{display:flex;align-items:center;gap:10px;height:54px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.logo svg{width:26px;height:26px}
.pills{margin-left:auto;display:flex;gap:2px}
.pill{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 9px;border-radius:999px;background:none;border:0;font-weight:500;font-size:15px;color:var(--ink);cursor:pointer}
.pill svg{width:16px;height:16px}
.pill:active{background:var(--surface-2)}
.pill.fl svg{color:var(--orange)} .pill.fl.off svg{color:var(--line-2)} .pill.xp svg{color:var(--accent)} .pill.ht svg{color:var(--coral)}

/* Bottom tab bar */
main{padding-top:6px;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 40px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:.5px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tabbar .in{display:flex;max-width:520px;margin:0 auto;height:var(--tab-h)}
.tb{flex:1;display:grid;justify-items:center;align-content:center;gap:3px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;padding:0}
.tb .ic{display:grid;place-items:center;height:26px}
.tb svg{width:23px;height:23px;stroke-width:1.8}
.tb[aria-current="page"]{color:var(--ink)}
@media (min-width:900px){
  .tabbar{left:50%;right:auto;bottom:20px;transform:translateX(-50%);width:400px;border:.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:0}
  main{padding-bottom:120px}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);color:var(--ink);font-weight:550;font-size:16px;cursor:pointer;transition:transform .12s ease,opacity .12s ease,background .15s;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:active:not(:disabled){transform:scale(.98);opacity:.85}
.btn.primary,.btn.white{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2);min-height:44px;padding:0 10px}
.btn.ghost.sm{min-height:34px;color:var(--accent);font-weight:550}
.btn:disabled{background:var(--surface-2);border-color:var(--surface-2);color:var(--muted);cursor:default}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:none;color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px;stroke-width:1.8}
.iconbtn:active{background:var(--surface-2)}
.say{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.say svg{width:17px;height:17px}
.say:active{transform:scale(.92)}

/* Cards & sections */
.card{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);padding:18px}
.sect{display:grid;gap:14px;margin-top:28px}
.sect>h2{font-size:21px}
.kicker{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.udot{width:6px;height:6px;border-radius:50%;background:var(--uc,var(--accent));display:inline-block;flex:none}
.page-h{display:grid;gap:4px;padding-top:10px}
.page-h h1{font-size:32px}
.bar{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.segs i{height:4px;border-radius:2px;background:var(--surface-2)}
.segs i.on{background:var(--uc,var(--accent))}

/* Learn */
.greet{display:grid;gap:4px;padding:14px 0 18px}
.greet h1{font-size:30px}
.hero{border-radius:var(--r-lg);padding:22px;background:var(--surface);border:.5px solid var(--line);box-shadow:var(--shadow);display:grid;gap:12px}
.hero h2{font-size:27px}
.hero p{color:var(--muted);font-size:15px;margin-top:-6px}
.hero .btn{margin-top:6px}
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:12px}
.today>div>b{font-weight:600}
.ring{width:58px;height:58px;position:relative}
.ring svg{width:58px;height:58px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring b{position:absolute;inset:0;display:grid;place-items:center;color:var(--accent)}
.ring b svg{width:20px;height:20px;transform:none}
.week{display:flex;gap:8px;margin-top:10px}
.day{display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted)}
.day i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--on-btn)}
.day i svg{width:12px;height:12px}
.day.on i{background:var(--ink-2);border-color:var(--ink-2)}
.day.goal i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day.now span{color:var(--ink);font-weight:600}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.qt{display:grid;gap:6px;align-content:start;text-align:left;background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:transform .12s}
.qt:active:not(:disabled){transform:scale(.98)}
.qt:disabled{cursor:default;opacity:.55}
.qt .qi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink);margin-bottom:4px}
.qt .qi svg{width:18px;height:18px}
.qt b{font-size:15.5px;font-weight:600;line-height:1.25}
.qt span{font-size:13.5px;color:var(--muted);line-height:1.35}
.notice{display:flex;gap:12px;align-items:center;background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.notice>svg{width:20px;height:20px;color:var(--accent)}
.notice div{flex:1;font-size:14.5px}
.pathhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:40px 2px 12px}
.pathhead h2{font-size:21px}
.unit{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);padding:16px 16px 18px;margin-top:10px;scroll-margin-top:80px}
.unit.current{box-shadow:var(--shadow);border-color:var(--line-2)}
.unit.complete .uhead h2{color:var(--ink-2)}
.uhead{display:flex;gap:12px;align-items:flex-start}
.uhead>div{flex:1;min-width:0}
.uhead h2{font-size:18px;margin-top:6px;letter-spacing:-.02em}
.uhead p{font-size:14px;color:var(--muted);margin-top:2px}
.newb{color:var(--accent);font-weight:600}
.nodes{display:flex;align-items:center;margin-top:16px}
.nodes .link{flex:1;height:1px;background:var(--line-2);min-width:6px}
.node{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);display:grid;place-items:center;font-size:14px;font-weight:550;cursor:pointer;padding:0;flex:none;transition:transform .12s}
.node:active{transform:scale(.92)}
.node svg{width:16px;height:16px}
.node.done{background:var(--uc);border-color:var(--uc);color:var(--surface)}
.node.cur{border:1.5px solid var(--ink);color:var(--ink);box-shadow:0 0 0 4px var(--surface-2)}
.node.lock{color:var(--line-2)}
.node.trophy{border-style:dashed;color:var(--line-2)}
.node.trophy.won{border-style:solid;border-color:var(--gold);color:var(--gold)}
.endcard{margin-top:28px;display:grid;gap:12px;justify-items:start}
.endcard .sic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);color:var(--accent);display:grid;place-items:center}
.endcard .sic svg{width:20px;height:20px}
.endcard h2{font-size:19px}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:70;display:grid;align-items:end}
.sheet .bd{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease}
.sheet .pn{position:relative;width:100%;max-width:540px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-height:88vh;overflow:auto;animation:sheetUp .34s cubic-bezier(.2,.9,.25,1)}
.sheet .grab{width:36px;height:5px;border-radius:9px;background:var(--line-2);justify-self:center;margin-bottom:6px}
.sheet h2{font-size:23px}
.sheet .sic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2)!important;color:var(--ink)}
.sheet .sic svg{width:22px;height:22px}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.fact{display:inline-flex;align-items:center;gap:6px;border:.5px solid var(--line-2);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.fact svg{width:14px;height:14px}
@media (min-width:700px){.sheet{align-items:center}.sheet .pn{border-radius:24px;padding-bottom:22px}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}

/* Lesson */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px)}
.lhead{display:flex;align-items:center;gap:12px;width:100%;max-width:640px;margin:0 auto;padding:8px max(14px,env(safe-area-inset-right,0px)) 4px max(8px,env(safe-area-inset-left,0px))}
.lprog{flex:1;height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.lprog i{display:block;height:100%;border-radius:99px;background:var(--ink);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.lhearts{display:flex;align-items:center;gap:4px;color:var(--ink);font-weight:550;font-size:15px;min-width:40px;justify-content:flex-end}
.lhearts svg{width:16px;height:16px;color:var(--coral)}
.lhearts.xp svg{color:var(--accent)}
.lbody{overflow-y:auto;-webkit-overflow-scrolling:touch}
.lwrap{max-width:600px;margin:0 auto;padding:22px max(22px,env(safe-area-inset-right,0px)) 28px max(22px,env(safe-area-inset-left,0px));display:grid;gap:22px}
.lwrap.enter{animation:slideIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}}
.etype{display:inline-flex;align-items:center;gap:6px;justify-self:start;font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.etype svg{width:14px;height:14px}
.streakchip{display:inline-flex;align-items:center;gap:4px;color:var(--orange);font-family:var(--f-mono);font-size:11.5px;font-weight:500;margin-left:10px}
.streakchip svg{width:12px;height:12px}
.qtitle{font-family:var(--f-display);font-size:25px;font-weight:600;line-height:1.22;letter-spacing:-.025em}
.qtext{display:flex;gap:12px;align-items:center;font-size:18px;line-height:1.5;padding:16px 18px;border:.5px solid var(--line);border-radius:var(--r);background:var(--surface)}
.qtext span{flex:1}
.gap{display:inline-block;min-width:80px;height:1.1em;border-bottom:2px solid var(--ink);margin:0 3px;vertical-align:-2px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;min-height:56px;border:1px solid var(--line);background:var(--surface);padding:12px 16px;border-radius:14px;cursor:pointer;font-size:16.5px;line-height:1.38;transition:transform .1s,background .15s,border-color .15s}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .k{display:none;width:24px;height:24px;flex:none;border:1px solid var(--line-2);border-radius:7px;place-items:center;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
@media (hover:hover){.opt .k{display:grid}.opt:hover:not(:disabled){border-color:var(--line-2)}}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[aria-pressed="true"] .k{border-color:var(--ink);color:var(--ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft);box-shadow:inset 0 0 0 1px var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad);animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.listen{display:flex;gap:12px;align-items:center;justify-content:center;padding:8px 0}
.lbtn{width:84px;height:84px;border-radius:50%;border:0;background:var(--btn);color:var(--on-btn);cursor:pointer;display:grid;place-items:center;transition:transform .12s}
.lbtn svg{width:34px;height:34px}
.lbtn:active{transform:scale(.94)}
.lbtn.slow{width:auto;height:44px;border-radius:999px;padding:0 16px;font-weight:550;font-size:14px;display:flex;gap:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.lbtn.slow svg{width:18px;height:18px}
.answerline{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:110px;padding:10px 0;background:repeating-linear-gradient(transparent 0 52px,var(--line) 52px 53px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-height:44px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:12px;cursor:pointer;font-size:16.5px;transition:transform .1s}
.tile:active{transform:scale(.96)}
.tile.ghost{background:var(--surface-2);border-color:var(--surface-2);color:transparent;cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:grid;gap:8px;align-content:start}
.match .tile{width:100%;text-align:center;font-size:15px;line-height:1.3;min-height:56px}
.match .tile.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.match .tile.gone{opacity:.3;cursor:default;border-color:var(--good)}
.match .tile.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
input.field,textarea.field,select.field{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;font-size:17px}
input.field:focus,textarea.field:focus{border-color:var(--ink);outline:none}
textarea.field{resize:vertical;min-height:110px;line-height:1.45}
.lfoot{border-top:.5px solid var(--line);background:var(--bg);padding:14px max(22px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));transition:background .2s}
.lfoot.ok{background:var(--good-soft);border-top-color:transparent}
.lfoot.no{background:var(--bad-soft);border-top-color:transparent}
.lfin{max-width:600px;margin:0 auto;display:flex;gap:8px;align-items:center}
.lfin .grow{flex:1}
.fb{display:grid;gap:14px;animation:fbUp .26s cubic-bezier(.2,.9,.25,1)}
@keyframes fbUp{from{transform:translateY(16px);opacity:0}}
.fbhead{display:flex;gap:12px;align-items:flex-start}
.fbi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;background:var(--good);margin-top:1px}
.fbi svg{width:16px;height:16px}
.no .fbi{background:var(--bad)}
.fbt{flex:1;display:grid;gap:3px;min-width:0}
.fbt b{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:-.02em;color:var(--good-2)}
.no .fbt b{color:var(--bad-2)}
.fbt p{font-size:15px;overflow-wrap:anywhere}
.fbt .ans{color:var(--ink);font-weight:600}
.fbt .why{color:var(--ink-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fbt b{color:var(--good)} :root:not([data-theme="light"]) .no .fbt b{color:var(--bad)}}
:root[data-theme="dark"] .fbt b{color:var(--good)} :root[data-theme="dark"] .no .fbt b{color:var(--bad)}
@media (min-width:700px){.fb{grid-template-columns:1fr auto;align-items:center}.fb .btn{min-width:180px}}
.center{max-width:440px;margin:0 auto;padding:36px max(24px,env(safe-area-inset-right,0px)) 32px max(24px,env(safe-area-inset-left,0px));display:grid;justify-items:center;text-align:center;gap:14px;align-content:center;min-height:100%}
.badge{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--surface)!important;border:1px solid var(--line-2);animation:badge .5s cubic-bezier(.2,1.3,.4,1)}
.badge svg{width:30px;height:30px}
@keyframes badge{from{transform:scale(.6);opacity:0}}
.center h1{font-size:28px}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);width:100%;border:.5px solid var(--line);border-radius:var(--r);background:var(--surface);margin:8px 0}
.st{padding:14px 6px;display:grid;gap:2px;border-left:.5px solid var(--line)}
.st:first-child{border-left:0}
.st b{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.st span{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.02em}
.newwords{width:100%;display:grid;gap:8px;text-align:left}
.nw{border-top:.5px solid var(--line);padding:10px 2px 0;display:grid;gap:1px}
.nw b{font-size:15.5px;font-weight:600} .nw span{font-size:14px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-2);animation:dot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* Words */
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:9px;font-weight:500;font-size:14.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:.5px solid var(--line-2);background:none;border-radius:999px;padding:7px 13px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.flip{perspective:1400px;width:100%;height:320px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.25,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:var(--r-lg);background:var(--surface);border:.5px solid var(--line);box-shadow:var(--shadow);display:grid;align-content:center;justify-items:center;gap:10px;padding:26px;text-align:center}
.face.back{transform:rotateY(180deg);text-align:left;justify-items:stretch;align-content:start;overflow:auto;gap:10px}
.face h2{font-size:clamp(28px,8vw,36px)}
.face .ftop{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}
.lvl{display:flex;gap:3px}
.lvl i{width:12px;height:3px;border-radius:2px;background:var(--line-2)}
.lvl i.on{background:var(--accent)}
.de{color:var(--accent);font-weight:550}
.ex{font-style:italic;color:var(--ink-2)}
.tag{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:.5px solid var(--line-2);padding:1px 5px;border-radius:5px}
.cardacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.searchbox input{padding-left:42px}
.list{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.list details{border-top:.5px solid var(--line)}
.list details:first-child{border-top:0}
.list summary{list-style:none;display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer}
.list summary::-webkit-details-marker{display:none}
.list summary div{flex:1;min-width:0}
.list summary b{display:block;font-weight:550}
.list summary .chv{width:18px;height:18px;color:var(--line-2);transition:transform .2s}
.list details[open] .chv{transform:rotate(90deg)}
.list .body{padding:0 16px 16px;display:grid;gap:8px}

/* Coach */
.scen{display:grid;background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:6px}
.sc{display:flex;gap:14px;align-items:center;text-align:left;background:none;border:0;border-top:.5px solid var(--line);padding:14px 16px;cursor:pointer}
.sc:first-child{border-top:0}
.sc:active{background:var(--surface-2)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--surface);font-weight:600;font-size:13.5px;flex:none}
.av svg{width:18px;height:18px}
.sc div{flex:1;min-width:0;display:grid;gap:1px}
.sc .who{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sc b{font-size:16px;font-weight:600}
.sc span{font-size:14px;color:var(--muted);line-height:1.35}
.sc .chv{width:18px;height:18px;color:var(--line-2)}
.locked{display:grid;gap:14px;justify-items:start;background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-lg);padding:22px}
.locked .sic{width:44px;height:44px;border-radius:14px;background:var(--surface-2);color:var(--accent);display:grid;place-items:center}
.locked .sic svg{width:22px;height:22px}
.locked ul{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--ink-2)}
.brief{display:flex;gap:12px;align-items:center;background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);padding:12px 14px}
.brief div{flex:1;min-width:0;font-size:14px}
.msgs{display:grid;gap:14px;padding:8px 0}
.msg{max-width:min(540px,88%);display:grid;gap:6px;animation:fbUp .25s}
.msg.me{justify-self:end}
.bubble{background:var(--surface);border:.5px solid var(--line);padding:11px 15px;border-radius:20px 20px 20px 6px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.msg.me .bubble{background:var(--btn);color:var(--on-btn);border-color:var(--btn);border-radius:20px 20px 6px 20px}
.mmeta{display:flex;gap:8px;align-items:center}
.coachnote{border-left:2px solid var(--accent);padding:4px 0 4px 12px;font-size:14.5px}
.coachnote summary{cursor:pointer;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);list-style:none;display:flex;align-items:center;gap:6px}
.coachnote summary::-webkit-details-marker{display:none}
.coachnote summary svg{width:13px;height:13px}
.md{display:grid;gap:8px;font-size:15px;margin-top:8px}
.md h4{font-family:var(--f-display);font-weight:600;font-size:16px;margin:6px 0 0}
.md ul{margin:0;padding-left:18px;display:grid;gap:4px}
.composer{position:sticky;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 12px;display:grid;gap:8px}
@media (min-width:900px){.composer{bottom:96px}}
.composer .row{flex-wrap:nowrap}
.composer textarea{min-height:50px;max-height:160px}
.out{white-space:pre-wrap;background:var(--surface-2);border-radius:var(--r-sm);padding:16px;overflow-wrap:anywhere;font-size:16px}
.err{color:var(--bad);font-size:15px;font-weight:500}

/* Profile */
.prof{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.flamebig{width:56px;height:56px;border-radius:50%;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center}
.flamebig svg{width:28px;height:28px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.sg{padding:14px 16px;display:grid;gap:2px;border-top:.5px solid var(--line)}
.sg:nth-child(-n+2){border-top:0}
.sg:nth-child(even){border-left:.5px solid var(--line)}
.sg b{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;color:var(--ink)!important}
.sg b svg{width:16px;height:16px;color:var(--muted)}
.sg span{font-size:13.5px;color:var(--muted)}
.group{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.gt{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:26px 4px 8px}
.it{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:54px;border-top:.5px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:default}
.group>.it:first-child{border-top:0}
button.it{cursor:pointer}
button.it:active{background:var(--surface-2)}
.it .ii{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface-2)!important;flex:none}
.it .ii svg{width:17px;height:17px}
.it .lb{flex:1;min-width:0;display:grid}
.it .lb b{font-weight:500;font-size:16px}
.it .lb span{font-size:13.5px;color:var(--muted)}
.it .val{color:var(--muted);font-size:15px}
.it .chv{width:18px;height:18px;color:var(--line-2)}
.it select{border:0;background:none;color:var(--muted);font-weight:500;font-size:15.5px;text-align:right;max-width:52%;cursor:pointer;padding:6px 0}
.it input[type=range]{width:130px;accent-color:var(--ink)}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:99px;background:var(--line-2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.3,.7,.3,1.1)}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(20px)}
.foot{text-align:center;font-size:12.5px;color:var(--muted);margin-top:26px}

/* Onboarding */
.onb{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.onb .center{min-height:calc(100vh - env(safe-area-inset-top,0px));align-content:center}
.onb .hlogo{width:64px;height:64px;margin-bottom:8px}
.onb h1{font-size:32px}
.onb p.lead{font-size:16.5px;color:var(--ink-2);max-width:34ch}
.choice{display:grid;width:100%;text-align:left;background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.ch{display:flex;gap:14px;align-items:center;border:0;border-top:.5px solid var(--line);background:none;padding:14px 16px;cursor:pointer;position:relative}
.ch:first-child{border-top:0}
.ch[aria-pressed="true"]{background:var(--surface-2)}
.ch[aria-pressed="true"]::after{content:"";position:absolute;right:18px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--accent)}
.ch div{flex:1;display:grid;gap:2px;padding-right:20px}
.ch b{font-size:16px;font-weight:600} .ch span{font-size:14px;color:var(--muted)}
.ch .big{font-family:var(--f-display);font-size:19px;font-weight:600;width:40px;text-align:center;color:var(--ink)}
.steps{display:flex;gap:6px;margin-top:6px}
.steps i{width:18px;height:3px;border-radius:9px;background:var(--line-2)}
.steps i.on{background:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--on-btn);padding:10px 18px;border-radius:14px;font-size:14px;font-weight:500;z-index:90;max-width:calc(100% - 40px);text-align:center;animation:fbUp .25s;box-shadow:var(--shadow)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:85}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>

const MODELS=[["claude-opus-5-5","Opus 5.5","beste Qualität"],["claude-sonnet-5-5","Sonnet 5.5","schneller, günstiger"],["claude-haiku-5-5","Haiku 5.5","am schnellsten, sehr günstig"]];
const hasAI=()=>!!S.cfg.key;
async function callClaude(opts){
  const {system,messages,schema,maxTokens=8000,effort="low",signal}=opts;
  if(!S.cfg.key)throw{code:"nokey"};
  const model=S.cfg.model||"claude-opus-5-5";
  const body={model,max_tokens:maxTokens,messages,output_config:{effort}};
  if(system)body.system=system;
  if(schema)body.output_config.format={type:"json_schema",schema};
  const headers={"content-type":"application/json","x-api-key":S.cfg.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
  const useFb=model!=="claude-haiku-5-5"&&!S.cfg.noFallback;
  if(useFb){body.fallbacks="default";headers["anthropic-beta"]="server-side-fallback-2026-07-01";}
  let res;
  try{res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify(body),signal});}
  catch(e){throw{code:e&&e.name==="AbortError"?"cancelled":"network"};}
  let data=null;try{data=await res.json();}catch(e){}
  if(!res.ok){const msg=(data&&data.error&&data.error.message)||"";
    if(res.status===400&&useFb&&/fallback|beta/i.test(msg)){S.cfg.noFallback=true;save();return callClaude(opts);}
    throw{code:res.status===401||res.status===403?"auth":res.status===429?"rate":res.status>=500?"server":"bad",message:msg};}
  if(data.stop_reason==="refusal")throw{code:"refusal"};
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  if(schema){try{return JSON.parse(text);}catch(e){throw{code:"json"};}}
  return text;
}

    answer:String(e.answer||"").trim(),pairs:(e.pairs||[]).filter(p=>p&&p.en&&p.de).map(p=>({en:String(p.en),de:String(p.de)})),explanation:String(e.explanation||"").trim(),say:e.say||""};

    if(x.type==="listen_choose"&&!x.answer)x.answer=x.text;
    if(!x.answer)return null;
    if(!x.options.some(o=>o===x.answer))x.options.push(x.answer);
    x.options=shuffle([...new Set(x.options)]).slice(0,5);if(!x.options.includes(x.answer))x.options[0]=x.answer;
    if(x.options.length<2)return null;

  }
  if(x.type==="listen_type"){if(!x.answer)x.answer=x.text;if(!x.text)x.text=x.answer;if(!x.answer||x.answer.split(" ").length>16)return null;}
  if(x.type==="build"){const w=x.answer.split(/\s+/).filter(Boolean);if(w.length<2||w.length>16)return null;
    const ans=new Set(w.map(norm));x.options=x.options.filter(o=>!ans.has(norm(o))&&o.split(" ").length===1).slice(0,4);}

    pick(terms.filter(t=>gapOf(t.ex,t.t)),2).forEach(t=>ex.push({type:"fill",prompt:"Ergänze die Lücke.",text:gapOf(t.ex,t.t),options:[t.t,...others(t).map(o=>o.t)],answer:t.t,explanation:t.ex}));
    pick(terms,1).forEach(t=>ex.push({type:"listen_choose",prompt:"Was hörst du?",text:t.ex,options:[t.ex,...others(t).slice(0,2).map(o=>o.ex)],answer:t.ex,explanation:t.ex}));
    pick(terms.filter(t=>t.ex.split(" ").length<=13),1).forEach(t=>ex.push({type:"build",prompt:"Hör zu und bilde den Satz.",text:"",say:t.ex,answer:t.ex,options:pick(others(t).flatMap(o=>o.ex.split(" ")),3),explanation:t.ex}));
    pick(terms,1).forEach(t=>ex.push({type:"listen_type",prompt:"Schreib, was du hörst.",text:t.t,answer:t.t,explanation:`${t.t} = ${t.de}`}));
    ex.push({type:"match",prompt:"Finde die Paare.",pairs:pick(terms,5).map(t=>({en:t.t,de:t.de})),explanation:""});
  } else if(u.kind==="phrase"){

    pick(ph,2).forEach(p=>{const ws=p.en.split(" ");const cand=ws.map((w,i)=>[w.replace(/[^A-Za-z'-]/g,""),i]).filter(([w])=>w.length>=5);if(!cand.length)return;
      const [w,i]=cand[Math.floor(Math.random()*cand.length)];const words=ph.flatMap(o=>o.en.split(" ").map(x=>x.replace(/[^A-Za-z'-]/g,""))).filter(x=>x.length>=5&&x.toLowerCase()!==w.toLowerCase());
      const t=ws.slice();t[i]=t[i].replace(w,"_____");ex.push({type:"fill",prompt:"Ergänze die Lücke.",text:t.join(" "),options:[w,...pick([...new Set(words)],3)],answer:w,explanation:p.en});});
    pick(ph,2).forEach(p=>ex.push({type:"listen_choose",prompt:"Was hörst du?",text:p.en,options:[p.en,...others(p).map(o=>o.en)],answer:p.en,explanation:p.de}));
    pick(ph.filter(p=>p.en.split(" ").length<=14),2).forEach(p=>ex.push({type:"build",prompt:"Hör zu und bilde den Satz.",text:"",say:p.en,answer:p.en,options:pick(others(p).flatMap(o=>o.en.split(" ")),3),explanation:p.de}));
    pick(ph.filter(p=>p.en.split(" ").length<=9),1).forEach(p=>ex.push({type:"listen_type",prompt:"Schreib, was du hörst.",text:p.en,answer:p.en,explanation:p.de}));
  } else {
    pick(FALSE_FRIENDS,5).forEach(([w,r,de])=>ex.push({type:"correct_sentence",prompt:"Welcher Satz ist korrekt?",options:[r,w],answer:r,explanation:de}));
    pick(FALSE_FRIENDS,2).forEach(([w,r,de])=>ex.push({type:"build",prompt:`Korrigiere: „${w}“`,text:"",answer:r,options:pick(w.split(" ").filter(x=>!r.split(" ").includes(x)),2),explanation:de}));
    pick(FALSE_FRIENDS,2).forEach(([w,r,de])=>ex.push({type:"listen_type",prompt:"Schreib, was du hörst.",text:r,answer:r,explanation:de}));
    ex.push({type:"match",prompt:"Deutsches Wort und richtige Übersetzung",pairs:shuffle([["aktuell","current"],["eventuell","perhaps"],["bekommen","get"],["sensibel","sensitive"],["kontrollieren","check"],["Chef","manager"],["konsequent","consistent"]]).slice(0,5).map(([de,en])=>({en,de})),explanation:""});
  }

}

async function aiLesson(uid){
  const u=U(uid);const angle=pick(UNIT_ANGLES,2).join(" and ");
  const prompt=`Create one gamified micro-lesson for a business English learning app.

Learner: native German speaker from Austria, works as Solution Area Specialist for Cloud & AI at Microsoft Austria (sells Azure infrastructure, data and AI solutions to enterprise and public-sector customers, works with partners, reports forecasts to a manager). Target level: ${S.cfg.level}.

- correct_sentence: prompt = "Welcher Satz ist korrekt?"; options = 3 English sentences, two contain a typical German-speaker mistake (false friend, preposition, tense, word order); answer = the correct one exactly.
- listen_choose: prompt = "Was hörst du?"; text = English sentence that will be read aloud; options = 3 similar sentences including the exact text; answer = text.
- listen_type: prompt = "Schreib, was du hörst."; text = short English sentence (max 10 words) read aloud; answer = same as text.
- build: prompt = "Übersetze ins Englische."; text = a German sentence; answer = natural English translation (max 12 words, no alternatives); options = 3 single distractor words that are NOT in the answer.
- match: prompt = "Finde die Paare."; pairs = 5 pairs with en = English term, de = German meaning; options = []; text = ""; answer = "".
For every exercise: unused fields are "" or []; explanation = one short German sentence that teaches why (e.g. the false friend or the nuance).
title = short German lesson title.`;
  const res=await aiJSON(prompt,LESSON_SCHEMA);

function askQuit(){
  if(L.idx===0&&L.state==="answer"){closeLesson();return;}
  openSheet(`<h2>Lektion beenden?</h2><p class="muted">Du bist schon ${Math.round(L.idx/L.queue.length*100)} % weit. Wenn du jetzt aufhörst, bekommst du keine XP für diese Lektion.</p>
    <button class="btn primary block" data-close>Weiterlernen</button><button class="btn block" id="quitNow">Beenden</button>`,s=>s.querySelector("#quitNow").onclick=()=>{closeSheet();closeLesson();});
}
function check(){
  const x=curEx();let ok=false;L.fbTitle="";
  if(["mc","fill","correct_sentence","listen_choose"].includes(x.type))ok=x.options[L.ans]===x.answer;
  if(x.type==="listen_type"){const a=norm(L.ans),b=norm(x.answer);ok=a===b;if(!ok&&lev(a,b)<=Math.max(1,Math.floor(b.length*.08))){ok=true;L.fbTitle="Fast perfekt! Kleiner Tippfehler.";}}
  if(x.type==="build")ok=norm(L.sel.map(i=>L.tiles[i]).join(" "))===norm(x.answer);
  grade(ok);
}
const mkey=x=>JSON.stringify([x.type,x.answer,x.text]);
function grade(ok){
  const x=curEx();
  if(ok){L.correct++;L.combo++;L.maxCombo=Math.max(L.maxCombo,L.combo);SND.ok();
    if(!L.fbTitle)L.fbTitle=L.combo>=5&&L.combo%5===0?`${L.combo} richtig in Folge!`:pick(["Richtig!","Super!","Stark!","Genau so!","Perfekt!","Sehr gut!"],1)[0];
    if(L.mode==="review"){const k=mkey(x);S.mistakes=S.mistakes.filter(m=>mkey(m)!==k);}
    L.state="ok";
  } else {
    L.wrong++;L.combo=0;SND.no();
    if(heartsOn()&&L.mode!=="review"){if(S.hearts.n===HEART_MAX)S.hearts.t=Date.now();S.hearts.n=Math.max(0,S.hearts.n-1);}
    const k=mkey(x);if(!S.mistakes.some(m=>mkey(m)===k))S.mistakes.push(x);
    if(!L.requeued.has(L.idx)){L.requeued.add(L.queue.length);L.queue.push(x);}
    L.fbAnswer=x.type==="match"?"alle Paare richtig zuordnen":x.answer;L.state="no";save();
  }
  renderEx();
}
function next(){
  if(L.state==="no"&&heartsOn()&&L.mode!=="review"&&S.hearts.n<=0){failLesson();return;}
  L.idx++;L.state="answer";L.ans=null;L.tiles=null;L.sel=null;L.m=null;L.spoken=false;L.fresh=true;
  try{renderTop();}catch(e){}renderEx();
}
function failLesson(){
  save();
  LZ().innerHTML=`<div></div><div class="lbody"><div class="center"><div class="badge" style="background:var(--coral)">${IC.heart}</div><h1>Keine Herzen mehr</h1>
   <p class="muted">Deine Fehler sind gespeichert. Wiederhole sie, um ein Herz zurückzubekommen, und versuch die Lektion dann nochmal.</p>
   <button class="btn primary block" id="rev">${IC.replay} Fehler wiederholen</button><button class="btn ghost" id="cl">Zum Lernpfad</button></div></div><div></div>`;
  $("#rev").onclick=()=>startLesson(null,"review");$("#cl").onclick=closeLesson;
}
/* The summary is computed and booked once (L.result); every later call only redraws it.
   Side effects that can fail (sound, confetti, chapter prefetch) run after the screen is on, each guarded. */
function finishLesson(){
  if(!L.result){
    const secs=Math.round((Date.now()-L.start)/1000),acc=Math.round(L.correct/Math.max(1,L.correct+L.wrong)*100);
    const perfect=L.wrong===0,xp=10+(perfect?5:0)+Math.floor(L.maxCombo/5)*2,before=xpToday();
    const r={secs,acc,perfect,xp,added:[],newDay:!L.wasActive,goalHit:false,unitDone:false};
    try{
      addXP(xp);S.stats.lessons++;if(perfect)S.stats.perfect++;if(L.source==="ai")S.stats.ai++;
      if(L.mode==="path"&&L.uid!==null)S.units[L.uid]=Math.min(LESSONS_PER_UNIT,(S.units[L.uid]||0)+1);
      if(L.mode==="review"&&S.hearts.n<HEART_MAX)S.hearts.n++;
      for(const t of (L.new_terms||[])){const k=String(t.term||"").trim().toLowerCase();if(k&&!VOCAB.some(v=>v.t.toLowerCase()===k)&&!S.lib.some(l=>l.t.toLowerCase()===k)){S.lib.push({t:t.term.trim(),de:t.de,d:t.definition,ex:t.example,u:L.uid===null?0:L.uid,added:today()});r.added.push(t);}}
      save();
      r.goalHit=before<S.cfg.goal&&xpToday()>=S.cfg.goal;r.unitDone=L.mode==="path"&&L.uid!==null&&S.units[L.uid]===LESSONS_PER_UNIT;
    }catch(e){reportErr(e);}
    L.result=r;
    setTimeout(()=>{try{SND.done();}catch(e){}try{confetti();}catch(e){}try{ensureNextChapter();}catch(e){}},60);
  }
  const r=L.result;let title="";try{title=r.unitDone?U(L.uid).title:"";}catch(e){}
  const head=r.unitDone?`„${esc(title)}“ abgeschlossen`:r.perfect?"Fehlerfrei":"Lektion abgeschlossen";
  const sub=r.newDay?`Serie: ${plural(streak(),"Tag","Tage")} in Folge`:r.goalHit?"Tagesziel erreicht":L.mode==="review"?"Deine Fehler sitzen jetzt besser":esc(L.title||"");
  LZ().innerHTML=`<div></div><div class="lbody"><div class="center">
   <div class="badge">${r.newDay?IC.flame:r.unitDone?IC.trophy:r.perfect?IC.star:IC.check}</div>
   <h1>${head}</h1><p class="muted">${sub}</p>
   <div class="tiles3"><div class="st"><b>XP</b><span>+${r.xp}</span></div><div class="st"><b>Treffer</b><span>${r.acc}%</span></div><div class="st"><b>Zeit</b><span>${Math.floor(r.secs/60)}:${String(r.secs%60).padStart(2,"0")}</span></div></div>
   ${r.added.length?`<div class="newwords"><div class="kicker">Neu in deinem Wortschatz</div>${r.added.map(t=>`<div class="nw"><b>${esc(t.term)}</b><span>${esc(t.de)}</span></div>`).join("")}</div>`:""}
   <button class="btn primary block" id="cont" data-act="close">Weiter</button></div></div><div></div>`;
}
function reportErr(e){try{console.error(e);toast("Fehler: "+(e&&e.message?e.message:String(e)).slice(0,120));}catch(x){}}
window.addEventListener("error",ev=>reportErr(ev.error||ev.message));
window.addEventListener("unhandledrejection",ev=>{const r=ev.reason;if(r&&r.code)return;reportErr(r);});
/* Close buttons on lesson screens work through delegation, so they keep working even if a screen's own wiring failed */
document.getElementById("lesson").addEventListener("click",e=>{if(e.target.closest('[data-act="close"]'))closeLesson();});
document.addEventListener("keydown",e=>{
  if(!L||LZ().hidden||!$("#sheet").hidden)return;
  if(e.key==="Enter"){const n=$("#nxt");if(n){e.preventDefault();n.click();return;}const c=$("#chk");if(c&&!c.disabled){e.preventDefault();c.click();}return;}
  if(document.activeElement&&document.activeElement.id==="typed")return;
  const d=parseInt(e.key,10);if(d>=1&&d<=9&&L.state==="answer"){const b=$(`.opt[data-i="${d-1}"]`);if(b)b.click();}
});

let vMode="cards",vUnit=null,vCard=null,vQ="";
function allTerms(){return VOCAB.map(v=>({...v,ai:false})).concat(chapters().flatMap(ch=>ch.terms.map(t=>({...t,u:ch.id,ai:ch.source==="ai"}))),S.lib.map(l=>({...l,ai:true})));}
function vDeck(){return allTerms().filter(t=>(vUnit===null||String(t.u)===String(vUnit))&&(!vQ||(t.t+" "+t.de).toLowerCase().includes(vQ.toLowerCase())));}
function nextCard(){const d=vDeck();if(!d.length){vCard=null;return;}const min=Math.min(...d.map(v=>S.box[v.t]||0));const pool=d.filter(v=>(S.box[v.t]||0)<=min+1&&(!vCard||v.t!==vCard.t));vCard=shuffle(pool.length?pool:d)[0];}
const lvlHtml=b=>`<span class="lvl" aria-label="Stufe ${b} von 5">${[1,2,3,4,5].map(i=>`<i class="${i<=b?"on":""}"></i>`).join("")}</span>`;

  if(!vCard||!vDeck().some(t=>t.t===vCard.t))nextCard();
  const all=allTerms(),d=vDeck(),mastered=all.filter(v=>(S.box[v.t]||0)>=3).length;
  const used=new Set(all.map(t=>String(t.u))),units=allUnits().filter(u=>used.has(String(u.id)));
  let body="";
  if(vMode==="cards"){
    if(!vCard)body=`<p class="muted">Keine Begriffe in dieser Auswahl.</p>`;
    else{const b=S.box[vCard.t]||0;
      body=`<div class="flip" id="flip" role="button" tabindex="0" aria-label="Karte umdrehen"><div class="in">
        <div class="face"><div class="ftop"><span class="kicker">${esc(U(vCard.u).title)}${vCard.ai?' <span class="tag">KI</span>':""}</span>${lvlHtml(b)}</div>
          <h2>${esc(vCard.t)}</h2><p class="muted small">Tippen zum Umdrehen</p></div>

          <div class="de">${esc(vCard.de)}</div><p>${esc(vCard.d)}</p><p class="ex">“${esc(vCard.ex)}”</p></div>
      </div></div>
      <div class="cardacts" id="cacts" hidden><button class="btn" id="again" style="--c:var(--coral)">${IC.replay} Nochmal</button><button class="btn good" id="know">${IC.check} Gewusst</button></div>
      <button class="btn primary block" id="turn">Umdrehen</button>`;}
  } else {
    body=`<div class="searchbox">${IC.search}<input class="field" type="search" id="vq" placeholder="Begriff suchen …" value="${esc(vQ)}"></div>
     ${d.length?`<div class="list">${d.map(v=>`<details><summary><div><b>${esc(v.t)}${v.ai?' <span class="tag">KI</span>':""}</b><span class="muted small">${esc(v.de)}</span></div>${lvlHtml(S.box[v.t]||0)}<span class="chv">${IC.chev}</span></summary>
       <div class="body"><p>${esc(v.d)}</p><p class="ex">“${esc(v.ex)}”</p><div>${sayBtn(v.t+". "+v.ex)}</div></div></details>`).join("")}</div>`:`<p class="muted">Nichts gefunden.</p>`}`;
  }

    <div class="stack">
      <div class="row" style="justify-content:space-between"><div class="seg" role="group"><button id="mC" aria-pressed="${vMode==="cards"}">Karteikarten</button><button id="mL" aria-pressed="${vMode==="list"}">Liste</button></div></div>
      <div class="chips"><button class="chip" data-u="" aria-pressed="${vUnit===null}">Alle</button>${units.map(u=>`<button class="chip" data-u="${esc(u.id)}" aria-pressed="${vUnit!==null&&String(vUnit)===String(u.id)}">${esc(u.title)}</button>`).join("")}</div>
      ${body}
      ${S.lib.length?"":`<p class="muted small">${hasAI()?"Neue Begriffe aus KI-Lektionen landen automatisch hier.":"Tipp: Begriffe, die du nicht weißt, kommen öfter dran. Ab Stufe 3 gilt ein Begriff als sicher."}</p>`}
    </div>`;
  $$("[data-u]").forEach(b=>b.onclick=()=>{vUnit=b.dataset.u===""?null:idOf(b.dataset.u);nextCard();render();});
  $("#mC").onclick=()=>{vMode="cards";render();};$("#mL").onclick=()=>{vMode="list";render();};
  const q=$("#vq");if(q)q.oninput=()=>{vQ=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{render();const n=$("#vq");n.focus();n.setSelectionRange(n.value.length,n.value.length);},250);};

    $("#flip").onclick=flip;$("#flip").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}};$("#turn").onclick=flip;
    $("#know").onclick=()=>{S.box[vCard.t]=Math.min(5,(S.box[vCard.t]||0)+1);SND.ok();addXP(1);nextCard();render();};
    $("#again").onclick=()=>{S.box[vCard.t]=0;save();nextCard();render();};
  }
}

function rolePrompt(sc){return `You are running a business English role-play for a native German speaker from Austria who works as a Solution Area Specialist for Cloud & AI at Microsoft Austria (selling Azure infrastructure, data and AI solutions to enterprise customers).

You play: ${sc.role}
The learner's goal in this conversation: ${sc.goal}

Rules:
${sc.casual?`This is a relaxed, friendly conversation between colleagues, not a sales meeting.
1. Stay fully in character. Reply in natural, informal spoken English, 1 to 3 sentences, like a real colleague: warm, curious, a little humour, share something about yourself and ask questions back. Do not steer the conversation towards selling or business decisions.`:`1. Stay fully in character. Reply in natural spoken business English, 2 to 4 sentences. Be realistic: ask follow-up questions, push back sometimes, don't agree too quickly.`}
2. After your in-character reply, write a line containing exactly ###COACH### and then coaching in German for the learner's LAST message only, at level ${LEVEL_TXT[S.cfg.level]}:
   - Up to 2 corrections as bullet points: **"original"** → **"better"** (short reason in German)
   - 1 bullet starting with "Tipp:" with a more natural or ${sc.casual?"friendlier, more idiomatic phrase for this casual chat":"persuasive phrase for this sales situation"}.
   If the English was excellent, say so in one short line instead of corrections.
3. For your very first line, write ###COACH### followed by one German sentence with a hint on how to open well.
Never break character above the ###COACH### line.`;}
const splitCoach=t=>{const i=t.indexOf("###COACH###");return i<0?[t.trim(),""]:[t.slice(0,i).trim(),t.slice(i+11).trim()];};
async function askRole(){
  R.busy=true;R.err="";render();R.ctl=new AbortController();
  try{const text=await aiText({system:rolePrompt(R.sc),messages:R.turns.slice(-30).map(t=>({role:t.role,content:t.content})),maxTokens:4000,signal:R.ctl.signal});
    R.turns.push({role:"assistant",content:text});if(S.cfg.autoSpeak)speak(splitCoach(text)[0]);}
  catch(e){R.err=aiErr(e);}
  R.busy=false;render();
}
async function reviewRole(){
  R.busy=true;R.review="";R.err="";render();R.ctl=new AbortController();
  const tr=R.turns.filter(t=>!t.hidden).map(t=>(t.role==="user"?"LEARNER: ":"COUNTERPART: ")+splitCoach(t.content)[0]).join("\n");
  try{R.review=await aiText({messages:[{role:"user",content:`You are an experienced business English coach for a native German speaker (Austria) working as a Solution Area Specialist for Cloud & AI at Microsoft Austria. Evaluate the LEARNER's English and ${R.sc.casual?"informal small talk with an international colleague (naturalness, warmth, asking questions back, keeping the conversation going)":"sales communication"} in this role-play. Scenario: ${R.sc.title}. Goal: ${R.sc.goal}

Write in German, with these markdown headings (####):
#### Gesamteindruck (1-2 Sätze plus geschätztes Niveau B1-C2)
#### Was gut war (2-3 bullets)
#### Die 3 wichtigsten Verbesserungen (bullets: **"original"** → **"better"** + kurze Begründung)
#### Gesprächsführung (1-3 bullets)
#### 5 Phrasen zum Merken (English phrases as bullets)

Transcript:
${tr.slice(-14000)}`}],maxTokens:6000,effort:"medium",signal:R.ctl.signal});addXP(5);}
  catch(e){R.err=aiErr(e);}
  R.busy=false;render();
}
function startRole(sc){R={sc,turns:[{role:"user",content:"(Start the conversation now with your opening line.)",hidden:true}],busy:false,err:"",review:""};render();askRole();}

async function exportBackup(){
  const data=JSON.parse(JSON.stringify(S));data.cfg.key="";
  const name="deal-room-english-backup-"+today()+".json",json=JSON.stringify(data,null,1);
  const done=()=>{S.lastBackup=Date.now();save();render();};
  try{const file=new File([json],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Deal Room English Backup"});done();toast("Backup gesichert");return;}}
  catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);done();toast("Backup gespeichert");
}

    <p class="muted">Mit einem eigenen Claude API-Key bekommst du unbegrenzt neue Lektionen, Rollenspiele und den Textcheck. Einen Key erstellst du in der Claude Console (console.anthropic.com → API Keys). Abgerechnet wird über dein API-Guthaben, grob 3 bis 6 Cent pro Lektion mit Opus, mit Haiku deutlich weniger. Der Key bleibt nur auf diesem Gerät.</p>
    <input class="field" type="password" id="key" value="${esc(S.cfg.key)}" placeholder="sk-ant-…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="API-Key">
    <div class="choice">${MODELS.map(([id,n,d])=>`<button class="ch" data-model="${id}" aria-pressed="${S.cfg.model===id}"><div><b>${n}</b><span>${d}</span></div></button>`).join("")}</div>
    <p class="small" id="keyMsg" aria-live="polite"></p>
    <button class="btn primary block" id="saveKey">Speichern und testen</button>
    ${S.cfg.key?`<button class="btn ghost" id="rmKey" style="color:var(--coral)">Key entfernen</button>`:""}`,
  s=>{let model=S.cfg.model;
    s.querySelectorAll("[data-model]").forEach(b=>b.onclick=()=>{model=b.dataset.model;s.querySelectorAll("[data-model]").forEach(o=>o.setAttribute("aria-pressed",o===b));});
    s.querySelector("#saveKey").onclick=async()=>{const k=s.querySelector("#key").value.trim(),msg=s.querySelector("#keyMsg");
      S.cfg.key=k;S.cfg.model=model;S.cfg.noFallback=false;PRE={};savePre();save();
      if(!k){closeSheet();render();return;}
      msg.textContent="Verbindung wird getestet …";msg.style.color="var(--muted)";
      try{await callClaude({messages:[{role:"user",content:"Reply with exactly: Ready"}],maxTokens:2000,effort:"low"});closeSheet();toast("KI-Coach ist aktiv");render();}
      catch(e){msg.textContent=aiErr(e);msg.style.color="var(--bad)";}};
    const rm=s.querySelector("#rmKey");if(rm)rm.onclick=()=>{S.cfg.key="";PRE={};savePre();save();closeSheet();toast("Key entfernt");render();};});
}

/* ---------- Onboarding ---------- */
let OB={step:0,level:"C1",goal:30};
function showOnb(){
  const el=$("#onb");el.hidden=false;document.body.classList.add("lock");
  const dots=`<div class="steps">${[0,1,2].map(i=>`<i class="${i<=OB.step?"on":""}"></i>`).join("")}</div>`;
  if(OB.step===0)el.innerHTML=`<div class="center">${LOGO}<h1>Deal Room English</h1><p class="lead">Business English für deinen Job als Solution Area Specialist Cloud &amp; AI. Kurze Lektionen mit echten Situationen aus Kundenterminen, Deals und Forecasts.</p>
    <div class="facts" style="justify-content:center"><span class="fact">${IC.bolt}5 bis 10 Minuten am Tag</span><span class="fact">${IC.speaker}Mit Aussprache</span><span class="fact">${IC.flame}Serie halten</span></div>
    <button class="btn primary block" id="ob">Los geht’s</button>${dots}</div>`;
  if(OB.step===1)el.innerHTML=`<div class="center"><h1>Wie gut ist dein Englisch?</h1><p class="lead">Danach richten sich Lektionen und Feedback. Du kannst das später im Profil ändern.</p>
    <div class="choice">${Object.entries(LEVELS).map(([k,[n,d]])=>`<button class="ch" data-lv="${k}" aria-pressed="${OB.level===k}"><span class="big">${n}</span><div><span>${d}</span></div></button>`).join("")}</div>
    <button class="btn primary block" id="ob">Weiter</button>${dots}</div>`;
  if(OB.step===2)el.innerHTML=`<div class="center"><h1>Wie viel Zeit pro Tag?</h1><p class="lead">Dein Tagesziel. Kleine, regelmäßige Einheiten wirken am besten.</p>
    <div class="choice">${GOALS.map(([v,t,n])=>`<button class="ch" data-gl="${v}" aria-pressed="${OB.goal===v}"><span class="big">${IC.bolt.replace("<svg",'<svg style="width:26px;height:26px;color:var(--gold)"')}</span><div><b>${t}</b><span>${n} · ${v} XP</span></div></button>`).join("")}</div>
    <button class="btn primary block" id="ob">Erste Lektion starten</button><button class="btn ghost" id="obLater">Erst umsehen</button>${dots}</div>`;
  el.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{OB.level=b.dataset.lv;showOnb();});
  el.querySelectorAll("[data-gl]").forEach(b=>b.onclick=()=>{OB.goal=+b.dataset.gl;showOnb();});
  const finish=start=>{S.cfg.level=OB.level;S.cfg.goal=OB.goal;S.onboarded=true;save();el.hidden=true;el.innerHTML="";document.body.classList.remove("lock");render();if(start)startLesson(0,"path");};
  $("#ob").onclick=()=>{if(OB.step<2){OB.step++;showOnb();}else finish(true);};
  const later=$("#obLater");if(later)later.onclick=()=>finish(false);
  el.scrollTo(0,0);
}

/* ================= Start ================= */
appReady=true;
render();
if(!S.onboarded)showOnb();
loadChapters();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
